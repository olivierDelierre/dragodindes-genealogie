<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf8f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1a2b" media="(prefers-color-scheme: dark)">
<title>Haras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap">
<link rel="icon" href="images/amande.png">
<link rel="stylesheet" href="brume.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar br-glass">
  <div class="brand">
    <img src="images/doree.png" alt="">
    <div>
      <h1>Haras</h1>
      <p>Généalogie des dragodindes · 66 montures · 10 générations · données <a href="https://dofuselevage.fr/tools/reproduction/dragodinde/genealogie" target="_blank" rel="noopener">DofusElevage</a></p>
    </div>
  </div>
  <button id="menuBtn" class="menu br-btn br-btn--secondary br-btn--sm" aria-controls="sidebar">☰ Montures</button>
  <button id="dirBtn" class="dir br-btn br-btn--secondary br-btn--sm" title="Inverser le sens de lecture dans toute l'application"></button>
  <button id="themeBtn" class="theme br-btn br-btn--secondary br-btn--sm"></button>
  <nav class="tabs br-tabs" role="tablist" style="--n:3;--i:0">
    <span class="br-tabs__thumb" aria-hidden="true"></span>
    <button role="tab" data-view="tree" class="br-tabs__tab active"><span class="lg">Arbre d'ascendance</span><span class="sm">Arbre</span></button>
    <button role="tab" data-view="overview" class="br-tabs__tab"><span class="lg">Vue d'ensemble</span><span class="sm">Ensemble</span></button>
    <button role="tab" data-view="plan" class="br-tabs__tab"><span class="lg">Liste de courses</span><span class="sm">Courses</span></button>
  </nav>
</header>

<div class="layout">
  <div id="backdrop" class="backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <button id="closeMenu" class="close-menu br-btn br-btn--ghost br-btn--sm" aria-label="Fermer">✕ Fermer</button>
    <input id="search" class="br-input" type="search" placeholder="Rechercher une dragodinde…" autocomplete="off">
    <label class="chk"><input type="checkbox" id="onlyOwned"> Seulement celles que je possède</label>
    <div id="list" class="list"></div>
    <div class="storage">
      <span id="ownedCount"></span>
      <button id="exportBtn" class="br-btn br-btn--secondary br-btn--sm" title="Télécharger mes montures possédées (JSON)">Exporter</button>
      <label class="btn br-btn br-btn--secondary br-btn--sm" title="Importer un fichier JSON exporté">Importer<input type="file" id="importFile" accept="application/json" hidden></label>
    </div>
  </aside>

  <main class="main">
    <section id="detail" class="detail"></section>

    <div class="toolbar">
      <div class="legend">
        <span><i class="sw p1"></i>Parent 1</span>
        <span><i class="sw p2"></i>Parent 2</span>
        <span class="ov-only"><i class="sw ch"></i>Enfants</span>
      </div>
      <div class="tree-only ctrls">
        <label>Profondeur
          <select id="depth" class="br-input br-input--sm">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="99">Tout</option>
          </select>
        </label>
      </div>
      <div class="ctrls">
        <button id="zoomOut" class="br-btn br-btn--secondary br-btn--sm" aria-label="Dézoomer">−</button>
        <span id="zoomVal">100%</span>
        <button id="zoomIn" class="br-btn br-btn--secondary br-btn--sm" aria-label="Zoomer">+</button>
        <button id="zoomFit" class="br-btn br-btn--secondary br-btn--sm">Ajuster</button>
      </div>
    </div>

    <div id="viewport" class="viewport">
      <div id="canvas" class="canvas"></div>
    </div>

    <section id="plan" class="plan"></section>
  </main>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
