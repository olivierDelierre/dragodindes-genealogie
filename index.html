<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf8f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1a2b" media="(prefers-color-scheme: dark)">
<title>Haras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="brume.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar br-glass">
  <div class="brand">
    <svg class="haras-icon" viewBox="0 0 128 128" aria-hidden="true" focusable="false">
<rect class="ic-tile" x="4" y="4" width="120" height="120" rx="28"/>
<circle class="ic-glow" cx="64" cy="72" r="48"/>
<circle class="ic-spark" cx="21" cy="66" r="2.4"/><circle class="ic-spark" cx="108" cy="100" r="2.8"/><circle class="ic-spark" cx="19" cy="100" r="2"/><circle class="ic-spark" cx="109" cy="70" r="2"/><circle class="ic-spark" cx="30" cy="40" r="1.8"/>
<path class="ic-deep" d="M48 96 L80 96 L84 124 L44 124Z"/>
<path class="ic-ear" d="M45 66 C32 54 22 36 16 11 C36 17 56 31 63 49Z"/><path class="ic-deep" d="M45 59 C37 50 30 38 26 24 C38 30 50 40 55 51Z"/><g transform="translate(128 0) scale(-1 1)"><path class="ic-ear" d="M45 66 C32 54 22 36 16 11 C36 17 56 31 63 49Z"/><path class="ic-deep" d="M45 59 C37 50 30 38 26 24 C38 30 50 40 55 51Z"/></g>
<path class="ic-horn" d="M47 44 C45 33 46 24 51 14 C56 23 58 34 58 45Z"/><g transform="translate(128 0) scale(-1 1)"><path class="ic-horn" d="M47 44 C45 33 46 24 51 14 C56 23 58 34 58 45Z"/></g>
<path class="ic-head" d="M64 32 C82 32 92 44 92 58 C92 72 80 82 64 82 C48 82 36 72 36 58 C36 44 46 32 64 32Z"/>
<path class="ic-deep" d="M42 82 L15 88 L34 101 L50 95Z"/><g transform="translate(128 0) scale(-1 1)"><path class="ic-deep" d="M42 82 L15 88 L34 101 L50 95Z"/></g>
<path class="ic-snout" d="M54 50 L74 50 C77 66 85 78 87 88 C80 99 70 107 64 111 C58 107 48 99 41 88 C43 78 51 66 54 50Z"/>
<path class="ic-snout2" d="M64 50 L54 50 C51 66 43 78 41 88 C48 99 58 107 64 111Z"/>
<path class="ic-nose" d="M52 97 C52 92 57 91 59 94 C60 98 56 100 52 97Z"/>
<path class="ic-nose" d="M76 97 C76 92 71 91 69 94 C68 98 72 100 76 97Z"/>
<path class="ic-line" d="M33 91 Q38 97 46 98"/><path class="ic-line" d="M95 91 Q90 97 82 98"/>
<path class="ic-fang" d="M73 104 L80 99 L77 112Z"/>
<circle class="ic-eye" cx="43" cy="56" r="15"/><circle class="ic-eye" cx="85" cy="54" r="16"/>
<circle class="ic-pupil" cx="39" cy="52" r="6.4"/><circle class="ic-pupil" cx="90" cy="49" r="6.8"/>
<circle class="ic-hl" cx="36.5" cy="49.5" r="2.2"/><circle class="ic-hl" cx="87.5" cy="46.2" r="2.4"/>
</svg>
    <div>
      <h1>Haras</h1>
      <p id="subtitle">Généalogie des montures · recettes <a href="https://dofuselevage.fr/tools/reproduction/dragodinde/genealogie" target="_blank" rel="noopener">DofusElevage</a></p>
    </div>
  </div>
  <button id="menuBtn" class="menu br-btn br-btn--secondary br-btn--sm" aria-controls="sidebar">☰ Montures</button>
  <div class="opt-wrap">
    <button id="optBtn" class="br-btn br-btn--secondary br-btn--sm opt-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="options" aria-label="Options" title="Options">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94c0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54a7.4 7.4 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.36 1.04.67 1.62.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7.4 7.4 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
    <div id="options" class="options br-glass" role="dialog" aria-label="Options" hidden>
      <div class="opt-user" id="optUser" hidden>
        <span>Connecté en tant que <b id="optName"></b></span>
        <button id="logoutBtn" class="br-btn br-btn--ghost br-btn--sm">Se déconnecter</button>
      </div>
      <div class="opt-group">
        <div class="opt-title">Thème</div>
        <div class="seg" id="themeSeg" role="group" aria-label="Thème">
          <button data-theme-set="auto" class="br-btn br-btn--sm">Auto</button>
          <button data-theme-set="light" class="br-btn br-btn--sm">☀︎ Clair</button>
          <button data-theme-set="dark" class="br-btn br-btn--sm">☾ Sombre</button>
        </div>
      </div>
      <div class="opt-group">
        <div class="opt-title">Sens de lecture</div>
        <div class="seg seg--col" id="dirSeg" role="group" aria-label="Sens de lecture">
          <button data-dir-set="fwd" class="br-btn br-btn--sm">Parents → Enfant</button>
          <button data-dir-set="rev" class="br-btn br-btn--sm">Enfant ← Parents</button>
        </div>
      </div>
      <p class="opt-note" id="optNote" hidden></p>
    </div>
  </div>
  <nav class="tabs fam br-tabs" id="famTabs" role="tablist" aria-label="Famille de montures" style="--n:3;--i:0">
    <span class="br-tabs__thumb" aria-hidden="true"></span>
    <button role="tab" data-fam="dragodinde" class="br-tabs__tab">Dragodindes</button>
    <button role="tab" data-fam="muldo" class="br-tabs__tab">Muldos</button>
    <button role="tab" data-fam="volkorne" class="br-tabs__tab">Volkornes</button>
  </nav>
  <nav class="tabs views br-tabs" id="viewTabs" role="tablist" style="--n:3;--i:0">
    <span class="br-tabs__thumb" aria-hidden="true"></span>
    <button role="tab" data-view="tree" class="br-tabs__tab active"><span class="lg">Arbre d'ascendance</span><span class="sm">Arbre</span></button>
    <button role="tab" data-view="overview" class="br-tabs__tab"><span class="lg">Vue d'ensemble</span><span class="sm">Ensemble</span></button>
    <button role="tab" data-view="plan" class="br-tabs__tab"><span class="lg">Liste de courses</span><span class="sm">Courses</span></button>
  </nav>
</header>

<div class="layout">
  <div id="backdrop" class="backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <button id="closeMenu" class="close-menu br-btn br-btn--ghost br-btn--sm" aria-label="Fermer">✕ Fermer</button>
    <input id="search" class="br-input" type="search" placeholder="Rechercher une monture…" autocomplete="off">
    <label class="chk"><input type="checkbox" id="onlyOwned"> Seulement celles que je possède</label>
    <div id="list" class="list"></div>
    <div class="storage">
      <span id="ownedCount"></span>
      <button id="exportBtn" class="br-btn br-btn--secondary br-btn--sm" title="Télécharger mes montures possédées (JSON)">Exporter</button>
      <label class="btn br-btn br-btn--secondary br-btn--sm" title="Importer un fichier JSON exporté">Importer<input type="file" id="importFile" accept="application/json" hidden></label>
    </div>
  </aside>

  <main class="main">
    <section id="detail" class="detail"></section>

    <div class="toolbar">
      <div class="legend">
        <span><i class="sw p1"></i>Parent 1</span>
        <span><i class="sw p2"></i>Parent 2</span>
        <span class="ov-only"><i class="sw ch"></i>Enfants</span>
      </div>
      <div class="tree-only ctrls">
        <label>Profondeur
          <select id="depth" class="br-input br-input--sm">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="99">Tout</option>
          </select>
        </label>
      </div>
      <div class="ctrls">
        <button id="zoomOut" class="br-btn br-btn--secondary br-btn--sm" aria-label="Dézoomer">−</button>
        <span id="zoomVal">100%</span>
        <button id="zoomIn" class="br-btn br-btn--secondary br-btn--sm" aria-label="Zoomer">+</button>
        <button id="zoomFit" class="br-btn br-btn--secondary br-btn--sm">Ajuster</button>
      </div>
    </div>

    <div id="viewport" class="viewport">
      <div id="canvas" class="canvas"></div>
    </div>

    <section id="plan" class="plan"></section>
  </main>
</div>

<div id="auth" class="auth" role="dialog" aria-modal="true" aria-labelledby="authTitle" hidden>
  <form id="authForm" class="auth-card br-glass" autocomplete="off">
    <h2 id="authTitle">Bienvenue au Haras</h2>
    <p>Choisis un pseudo pour retrouver tes montures possédées. Pas de mot de passe.</p>
    <label class="auth-field">Pseudo
      <input id="authName" class="br-input" type="text" maxlength="30" minlength="2" required autocapitalize="none" spellcheck="false" autocomplete="username">
    </label>
    <label class="chk"><input type="checkbox" id="authRemember" checked> Se souvenir de moi</label>
    <p id="authErr" class="auth-err" role="alert" hidden></p>
    <div class="auth-actions">
      <button type="submit" id="authLogin" class="br-btn br-btn--primary">Se connecter</button>
      <button type="button" id="authRegister" class="br-btn br-btn--secondary">Créer un compte</button>
    </div>
  </form>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
