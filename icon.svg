<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<title>Haras</title>
<style>
:root{--ic-tile:#26A69A;--ic-glow:#4DB6AC;--ic-spark:#B2DFDB;--ic-head:#FFC107;--ic-snout:#FFD54F;--ic-snout2:#FFCA28;--ic-deep:#FFA000;--ic-horn:#8D6E63;--ic-eye:#FAFAFA;--ic-pupil:#3E2723;--ic-nose:#B26A00;--ic-fang:#FFF8E1}
@media (prefers-color-scheme:dark){:root{--ic-tile:#00695C;--ic-glow:#00796B;--ic-spark:#4DB6AC;--ic-head:#FFB300;--ic-snout:#FFCA28;--ic-snout2:#FFC107;--ic-deep:#FF8F00;--ic-horn:#A1887F;--ic-eye:#ECEFF1;--ic-pupil:#1B0F0A;--ic-nose:#8A4B00;--ic-fang:#FFF3E0}}
.ic-tile{fill:var(--ic-tile)}
.ic-glow{fill:var(--ic-glow)}
.ic-spark{fill:var(--ic-spark)}
.ic-ear,.ic-head{fill:var(--ic-head)}
.ic-deep{fill:var(--ic-deep)}
.ic-horn{fill:var(--ic-horn)}
.ic-snout{fill:var(--ic-snout)}
.ic-snout2{fill:var(--ic-snout2)}
.ic-nose{fill:var(--ic-nose)}
.ic-line{fill:none;stroke:var(--ic-deep);stroke-width:2.4;stroke-linecap:round}
.ic-fang{fill:var(--ic-fang)}
.ic-eye{fill:var(--ic-eye)}
.ic-pupil{fill:var(--ic-pupil)}
.ic-hl{fill:var(--ic-eye)}
</style>
