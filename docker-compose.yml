# Haras sur TrueNAS (Apps → Discover Apps → ⋮ → Install via YAML) ou n'importe quel hôte Docker.
services:
  haras:
    # Image publiée par .github/workflows/docker.yml (tags : latest = main, brume = cette branche).
    image: ghcr.io/olivierdelierre/dragodindes-genealogie:brume
    container_name: haras
    restart: unless-stopped
    user: "568:568"
    ports:
      - "8765:8765"
    volumes:
      # Chemin d'un dataset TrueNAS dont l'utilisateur 568 est propriétaire (voir README).
      - /mnt/POOL/apps/haras:/data
